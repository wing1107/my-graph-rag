# docker-compose.yml — 给接收方本地运行用
# 使用方法：
#   1. 在同目录创建 .env 文件，填入 API Key（参考 .env.example）
#   2. docker compose up
#   3. 浏览器访问 http://localhost:7860

services:
  app:
    # ── 方式一：从 Docker Hub 拉取现成镜像（无需代码，直接 docker compose up）──
    image: wing1107/my-graph-rag:latest
    # ── 方式二：git clone 代码后本地构建（注释掉 image，取消注释 build）──
    # build: .
    ports:
      - "7860:7860"
    env_file:
      - .env                         # API Key 等敏感配置从 .env 读取
    volumes:
      # 向量库：接收方需先在宿主机构建，或从你这里复制
      - ./data_base/vector_db:/app/data_base/vector_db
      # 知识库原始文档（接收方放自己的文档）
      - ./data_base/kownledge_db:/app/data_base/kownledge_db
      # OCR 缓存（可选，避免重复 OCR）
      - ./data_base/ocr_cache:/app/data_base/ocr_cache
      # 会话持久化
      - ./sessions:/app/sessions
    restart: unless-stopped

  # 可选：同时启动 FastAPI（取消注释即可）
  # api:
  #   image: your-dockerhub-username/my-graph-rag:latest
  #   command: uvicorn api.fast_api:app --host 0.0.0.0 --port 8000
  #   ports:
  #     - "8000:8000"
