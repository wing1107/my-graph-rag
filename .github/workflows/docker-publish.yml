name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]          # git tag v1.0.0 时也会触发
  workflow_dispatch:             # 允许在 GitHub 页面手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check secrets (debug)
        run: |
          if [ -z "$UNAME" ]; then echo "DOCKERHUB_USERNAME is EMPTY"; else echo "DOCKERHUB_USERNAME length=${#UNAME}"; fi
          if [ -z "$TOKEN" ]; then echo "DOCKERHUB_TOKEN is EMPTY"; else echo "DOCKERHUB_TOKEN length=${#TOKEN}"; fi
        env:
          UNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 根据分支/tag 自动生成镜像标签
      # push main → :latest
      # push v1.2.3 → :v1.2.3  且  :latest
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/my-graph-rag
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
