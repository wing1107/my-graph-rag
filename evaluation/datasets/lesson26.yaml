# 黄金集：日语教材《大家日本语2》第26课系列检索层回归保护
#
# 背景：大家日本语2 是图片型 PDF，经 Qwen-VL OCR 识别后向量化入库。
# 第26课页码（0-indexed）：
#   page=12  文型・例文
#   page=13  会話（どこに ごみを 出したら いいですか）
#   page=14  練習 A
#   page=15  練習 B
#   page=16  練習 B（续）
#   page=17  練習 C
#   page=18  問題
#   page=19  問題（续）
#
# 命中判定（OR 关系，任一满足即算命中）：
#   1) retrieved.page in expected_pages
#   2) retrieved.content 包含 expected_keywords_any 任一项
#   3) retrieved.source 文件名包含 expected_source（可选过滤）
#
# 向量库：faiss_multilingual（multilingual embedding）
# 运行：python -m evaluation.cli run --dataset lesson26 --embedding multilingual --retriever hybrid
dataset: lesson26
source_filter: "大家日本语2"
embedding_hint: multilingual
notes: |
  种子黄金集，覆盖第26课的五个典型问题（会话/文型/练习 + 跨语言关键词）。
  page 是 metadata.page，0-indexed；与 SmartPDFLoader / fitz 页号一致。

cases:
  - id: lesson26_kaiwa
    query: "第26课的会话内容是什么？"
    expected_pages: [13]
    expected_keywords_any:
      - "どこに ごみを 出したら いいですか"
      - "引っ越しの 荷物"
      - "【会话/对话】"
    expected_source: "大家日本语2"
    notes: |
      会話页 page=13，场景是米勒搬家后询问垃圾投放规则。
      期望进入 top 5。

  - id: lesson26_bunpou
    query: "第26课的文型和例句"
    expected_pages: [12]
    expected_keywords_any:
      - "旅行なんです"
      - "いただけませんか"
      - "文 型"
      - "例 文"
    expected_source: "大家日本语2"
    notes: "文型页 page=12，含「～んです」和「～ていただけませんか」两个核心句型。"

  - id: lesson26_renshuu
    query: "第26课的练习题"
    expected_pages: [14, 15, 16, 17]
    expected_keywords_any:
      - "練習"
      - "れんしゅう"
    expected_source: "大家日本语2"
    notes: "練習 A/B/C 分布在 page=14-17，命中任一即可。"

  - id: lesson26_mondai
    query: "第26课的问题练习"
    expected_pages: [14, 15, 16, 17, 18, 19]
    expected_keywords_any:
      - "問題"
      - "もんだい"
      - "練習"
      - "れんしゅう"
    expected_source: "大家日本语2"
    notes: |
      問題页 page=18-19，但 OCR 内容稀少（主要是空白填空格），
      检索信号弱；放宽到覆盖练习题全范围（14-19），命中任一即可。

  - id: lesson26_overview
    query: "第26课讲了什么？"
    expected_pages: [12, 13, 14, 15, 16, 17, 18, 19]
    expected_keywords_any:
      - "【第26課】"
      - "第 26 課"
      - "第26課"
    expected_source: "大家日本语2"
    notes: "概括类问题；第26课任一页命中即算通过。"

  - id: cross_lang_kaiwa_jp2
    query: "会话"
    expected_keywords_any:
      - "会話"
      - "【会话/对话】"
    top_k_override: 10
    notes: |
      跨语言最小复现：中文"会话"应能匹配到日语"会話"页面。
      不限定 source，整本书含会話的页面均算命中。
